owner: hkamm123 # GitHub user that owns this repository
repo: jwt-pizza-status # Name of this repository

# Each site is checked every 5 minutes by .github/workflows/uptime.yml.
# A non-2xx response (or a timeout) opens a GitHub Issue; recovery closes it.
sites:
  - name: JWT Pizza
    url: https://pizza.echowebprogramming.click
    icon: https://pizza.echowebprogramming.click/jwt-pizza-icon.png
  - name: JWT Pizza Service
    # The root endpoint returns the welcome message and version without
    # querying the database, so these checks don't keep Aurora from pausing.
    url: https://pizza-service.echowebprogramming.click
    expectedStatusCodes:
      - 200
    icon: https://pizza.echowebprogramming.click/jwt-pizza-icon.png

status-website:
  # Custom domain for GitHub Pages. Cloudflare has a DNS-only CNAME
  # status.pizza -> hkamm123.github.io, and Upptime writes the CNAME file.
  cname: status.pizza.echowebprogramming.click
  logoUrl: https://pizza.echowebprogramming.click/jwt-pizza-icon.png
  name: JWT Pizza Status
  introTitle: "**JWT Pizza** service status"
  introMessage: Live uptime and response times for the JWT Pizza website and its backend service. Checks run every 5 minutes from GitHub Actions.
  navbar:
    - title: Status
      href: /
    - title: JWT Pizza
      href: https://pizza.echowebprogramming.click
    - title: GitHub
      href: https://github.com/$OWNER/$REPO
